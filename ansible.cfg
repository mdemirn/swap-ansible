[defaults]
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = False
retry_files_enabled = False
gathering = smart
fact_caching = memory
# After encrypting inventory/group_vars/vault.yml, point Ansible at your vault password file:
# vault_password_file = .vault_pass
timeout = 30
callbacks_enabled = profile_tasks

[privilege_escalation]
become = True
become_method = sudo
become_user = root

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
