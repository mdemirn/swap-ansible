---
all:
  children:
    linux_servers:
      hosts:
        node-01:
          ansible_host: node-01.example.internal
          ssh_private_key: ~/.ssh/id_ed25519
        node-02:
          ansible_host: node-02.example.internal
          ssh_private_key: ~/.ssh/id_ed25519
        node-03:
          ansible_host: node-03.example.internal
          ssh_private_key: ~/.ssh/id_ed25519
      vars:
        ansible_user: root
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
        ansible_ssh_private_key_file: "{{ (ssh_auth_method == 'key') | ternary(ssh_private_key, omit) }}"
        ansible_ssh_pass: "{{ (ssh_auth_method == 'password') | ternary(vault_ssh_password, omit) }}"
